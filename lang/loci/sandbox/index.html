<!DOCTYPE html><html lang="pl"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>LEKTURA</title><link rel="icon" href="/dot-gener/favicon.ico"/><link rel="stylesheet" href="https://esm.sh/katex@0.19.1/dist/katex.min.css"/><style>@layer shell, widget, layout, route;
@layer shell {
/*
 * @project-metadata
 * Path: web/page-shell.css
 * Author: Jan Roman Cisowski
 * ORCID: https://orcid.org/0009-0009-2907-3792
 * Repository: https://github.com/j-Cis/dot-gener
 */

html,
body {
	background-color: #101116;
	color: #cfcfd0;
	color-scheme: dark;
}

body {
	margin: 0;
	font-family: system-ui, sans-serif;
}

.page {
	max-width: 54rem;
	margin: 0 auto;
	padding: 2rem 1rem;
}
/* web/strona404.tsx — mapa stron na stronie 404 */
.mapa-stron {
	line-height: 1.8;
	& ul {
		padding-inline-start: 1.5rem;
	}
}
.mapa-stron-plik,
.mapa-stron-folder {
	color: #6b7280;
	font-family: ui-monospace, "Cascadia Mono", Consolas, "DejaVu Sans Mono", monospace;
	font-size: 0.85em;
}
.mapa-stron-plik {
	margin-inline-start: 0.5rem;
}

}
@layer widget {
/*
 * @project-metadata
 * Path: site/client/VectorViewport.island.css
 * Author: Jan Roman Cisowski
 * ORCID: https://orcid.org/0009-0009-2907-3792
 * Repository: https://github.com/j-Cis/dot-gener
 */

/* VectorViewport.island.tsx — obramowanie */
.viewport {
	box-sizing: border-box; /* ramka wliczona w 100%, bez nadmiaru */
	--viewport-border: #c7ba041f;
	border: 1px dotted var(--viewport-border);
	height: 100%; /*⚠️⚠️⚠️może powodować błedy */
}

/* stół: przesuwanie i zoom */
.viewport-stol {
	position: relative;
	overflow: hidden;
	cursor: grab;
	touch-action: none;
	user-select: none;
}
.viewport-stol:active {
	cursor: grabbing;
}
.viewport-stol.is-locked {
	cursor: default;
	touch-action: pan-y;
}
.viewport-stol.is-locked:active {
	cursor: default;
}

/* renderer SVG */
.viewport-tresc {
	position: absolute;
	top: 0;
	left: 0;
	width: max-content;
	transform-origin: 0 0;
}
.viewport-tresc svg {
	display: block;
}

/* renderer Canvas */
.viewport-plotno {
	display: block;
	width: 100%;
	height: 100%;
}

.viewport-zamek {
	position: absolute;
	top: 8px;
	right: 8px;
	z-index: 2;
	padding: 4px 8px;
	border: 1px solid rgba(0, 0, 0, 0.2);
	border-radius: 6px;
	background: rgba(255, 255, 255, 0.85);
	cursor: pointer;
	font-size: 16px;
	line-height: 1;
}

/*
 * @project-metadata
 * Path: site/widget/Paragraph.widget.css
 * Author: Jan Roman Cisowski
 * ORCID: https://orcid.org/0009-0009-2907-3792
 * Repository: https://github.com/j-Cis/dot-gener
 */

.text-paragraph {
	margin-block: 6px;
	line-height: 1.8;
	text-indent: 2em;
}
.text-paragraph--no-indent {
	margin-block: 6px;
	line-height: 1.8;
}

/*
 * @project-metadata
 * Path: site/widget/Table.widget.css
 * Author: Jan Roman Cisowski
 * ORCID: https://orcid.org/0009-0009-2907-3792
 * Repository: https://github.com/j-Cis/dot-gener
 */

/* Table.widget.tsx — siatka (CSS grid) w oknie przewijania */
.tabela {
	/* okno: szerokość strony; przewija, gdy siatka jest szersza (width > 100%) albo wyższa niż height */
	overflow: auto;
	max-width: 100%;
}
.tabela-siatka {
	display: grid;
	/* ścieżki od początku — wiersze "auto" nie rozciągają się, gdy okno (height) jest wyższe niż treść */
	justify-content: start;
	align-content: start;
}
.tabela-box {
	/* nagłówek + treść; kierunek zależy od strony nagłówka */
	display: flex;
	flex-direction: column;
}
.tabela-box-N {
	flex-direction: column;
}
.tabela-box-S {
	flex-direction: column-reverse;
}
.tabela-box-W {
	flex-direction: row;
}
.tabela-box-E {
	flex-direction: row-reverse;
}
.tabela-naglowek {
	display: flex;
	flex: none;
	padding: 0.25rem 0.5rem;
	font-weight: 600;
	background-color: rgb(255 255 255 / 0.04);
}
.tabela-box-W > .tabela-naglowek,
.tabela-box-E > .tabela-naglowek {
	/* nagłówek z boku: start/center/end działa w pionie */
	flex-direction: column;
}
.tabela-naglowek-start {
	justify-content: flex-start;
	text-align: start;
}
.tabela-naglowek-center {
	justify-content: center;
	text-align: center;
}
.tabela-naglowek-end {
	justify-content: flex-end;
	text-align: end;
}
.tabela-obrot-prawo {
	/* o 90° w prawo: czytamy z góry na dół */
	writing-mode: vertical-rl;
}
.tabela-obrot-lewo {
	/* o 90° w lewo: czytamy z dołu do góry */
	writing-mode: vertical-rl;
	transform: rotate(180deg);
}
.tabela-tresc {
	/* treść większa niż obszar (np. stała wysokość wiersza) przewija się w obszarze */
	flex: 1 1 auto;
	min-width: 0;
	min-height: 0;
	overflow: auto;
	/* zapas na dół chipów kodu (code.tec) w ostatniej linii: mieszczą się w paddingu, bez paska */
	padding-block-end: 0.2em;
}

/*
 * @project-metadata
 * Path: site/widget/Title.widgets.css
 * Author: Jan Roman Cisowski
 * ORCID: https://orcid.org/0009-0009-2907-3792
 * Repository: https://github.com/j-Cis/dot-gener
 */

/* Title.widgets.tsx */
.title {
	display: flex;
	align-items: baseline;
	gap: 0.5em;
	line-height: 1.2;
}
.title-prefix {
	font-variant-numeric: tabular-nums;
	font-weight: 600;
	color: #6b7280;
}
/* kotwica #id jak w markdown: „#” po lewej, widoczny po najechaniu / fokusie */
.title {
	position: relative;
	scroll-margin-top: 1rem; /* po skoku do #id nagłówek nie dotyka krawędzi */
	padding-inline: 0.25em;
	margin-inline: -0.25em;
	border-radius: 0.25rem;
	transition: background-color 0.15s;
}
.title:hover {
	background-color: rgb(255 255 255 / 0.04);
}
.title:target {
	/* nagłówek, do którego prowadzi adres …#id */
	background-color: rgb(79 133 216 / 0.14);
	box-shadow: inset 3px 0 0 #4f85d8;
}
.title-kotwica {
	position: absolute;
	top: 0;
	right: 100%;
	padding-inline-end: 0.2em;
	color: #6b7280;
	text-decoration: none;
	opacity: 0;
	transition: opacity 0.15s;
}
.title:hover .title-kotwica,
.title-kotwica:focus-visible {
	opacity: 1;
}
.title-kotwica:hover {
	color: #4f85d8;
}
/* TitleSection collapsible — cała linia tytułu przełącza treść */
.title-zwijana > summary {
	display: block;
	list-style: none;
	cursor: pointer;
}
.title-zwijana > summary::-webkit-details-marker {
	display: none;
}
.title-zwijana > summary > .title::after {
	content: "▾";
	color: #6b7280;
	font-size: 0.7em;
	transition: transform 0.15s;
}
.title-zwijana:not([open]) > summary > .title::after {
	transform: rotate(-90deg);
}
@media (prefers-reduced-motion: reduce) {
	.title-zwijana > summary > .title::after {
		transition: none;
	}
}

html,
body {
	background-color: #101116;
	color: #cfcfd0;
	color-scheme: dark;
}

body {
	margin: 0;
	font-family: system-ui, sans-serif;
}

.page {
	max-width: 54rem;
	margin: 0 auto;
	padding: 2rem 1rem;
}
/* web/strona404.tsx — mapa stron na stronie 404 */

	& ul {
		padding-inline-start: 1.5rem;
	}

.mapa-stron-plik,
.mapa-stron-folder {
	color: #6b7280;
	font-family: ui-monospace, "Cascadia Mono", Consolas, "DejaVu Sans Mono", monospace;

	margin-inline-start: 0.5rem;

/*
 * @project-metadata
 * Path: site/client/VectorViewport.island.css
 * Author: Jan Roman Cisowski

/* VectorViewport.island.tsx — obramowanie */
.viewport {
	box-sizing: border-box; /* ramka wliczona w 100%, bez nadmiaru */
	--viewport-border: #c7ba041f;
	border: 1px dotted var(--viewport-border);
	height: 100%; /*⚠️⚠️⚠️może powodować błedy */
}

/* stół: przesuwanie i zoom */
.viewport-stol {
	position: relative;
	overflow: hidden;
	cursor: grab;
	touch-action: none;
	user-select: none;
}
.viewport-stol:active {
	cursor: grabbing;
}
.viewport-stol.is-locked {
	cursor: default;
	touch-action: pan-y;
}
.viewport-stol.is-locked:active {
	cursor: default;
}

/* renderer SVG */
.viewport-tresc {
	position: absolute;
	top: 0;
	left: 0;
	width: max-content;
	transform-origin: 0 0;
}
.viewport-tresc svg {
	display: block;
}

/* renderer Canvas */
.viewport-plotno {
	display: block;
	width: 100%;
	height: 100%;
}

.viewport-zamek {
	position: absolute;
	top: 8px;
	right: 8px;
	z-index: 2;
	padding: 4px 8px;
	border: 1px solid rgba(0, 0, 0, 0.2);
	border-radius: 6px;
	background: rgba(255, 255, 255, 0.85);
	cursor: pointer;
	font-size: 16px;
	line-height: 1;
}

/* Table.widget.tsx — siatka (CSS grid) w oknie przewijania */
.tabela {
	/* okno: szerokość strony; przewija, gdy siatka jest szersza (width > 100%) albo wyższa niż height */
	overflow: auto;
	max-width: 100%;
}
.tabela-siatka {
	display: grid;
	/* ścieżki od początku — wiersze "auto" nie rozciągają się, gdy okno (height) jest wyższe niż treść */
	justify-content: start;
	align-content: start;
}
.tabela-box {
	/* nagłówek + treść; kierunek zależy od strony nagłówka */
	display: flex;
	flex-direction: column;
}
.tabela-box-N {
	flex-direction: column;
}
.tabela-box-S {
	flex-direction: column-reverse;
}
.tabela-box-W {
	flex-direction: row;
}
.tabela-box-E {
	flex-direction: row-reverse;
}
.tabela-naglowek {
	display: flex;
	flex: none;
	padding: 0.25rem 0.5rem;
	font-weight: 600;
	background-color: rgb(255 255 255 / 0.04);
}
.tabela-box-W > .tabela-naglowek,
.tabela-box-E > .tabela-naglowek {
	/* nagłówek z boku: start/center/end działa w pionie */
	flex-direction: column;
}
.tabela-naglowek-start {
	justify-content: flex-start;
	text-align: start;
}
.tabela-naglowek-center {
	justify-content: center;
	text-align: center;
}
.tabela-naglowek-end {
	justify-content: flex-end;
	text-align: end;
}
.tabela-obrot-prawo {
	/* o 90° w prawo: czytamy z góry na dół */
	writing-mode: vertical-rl;
}
.tabela-obrot-lewo {
	/* o 90° w lewo: czytamy z dołu do góry */
	writing-mode: vertical-rl;
	transform: rotate(180deg);
}
.tabela-tresc {
	/* treść większa niż obszar (np. stała wysokość wiersza) przewija się w obszarze */
	flex: 1 1 auto;
	min-width: 0;
	min-height: 0;
	overflow: auto;
	/* zapas na dół chipów kodu (code.tec) w ostatniej linii: mieszczą się w paddingu, bez paska */
	padding-block-end: 0.2em;
}
